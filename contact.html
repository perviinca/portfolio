		<main class="contact-section py-5">
			<div class="container py-5">
				<div class="row align-items-center">
					<div class="col-lg-5 d-flex flex-column align-items-center text-center text-lg-start mb-5 mb-lg-0">
						<h2 class="contact-title mb-5 w-100">
							Interested in working together?<br />
							Have a question for me?<br />
							Let's talk!
						</h2>
						<div class="illustration-wrapper">
							<img src="./assets/ill-neko-violet.svg" alt="Lucky Cat" class="img-fluid contact-cat" />
						</div>
					</div>

					<div class="col-lg-7">
						<form action="https://formspree.io" method="POST" class="contact-form">
							<div class="mb-4">
								<label class="form-label">Name*</label>
								<input type="text" name="name" class="custom-input" required />
							</div>
							<div class="mb-4">
								<label class="form-label">Email*</label>
								<input type="email" name="email" class="custom-input" required />
							</div>
							<div class="mb-4">
								<label class="form-label">Business*</label>
								<input type="text" name="business" class="custom-input" />
							</div>

							<div class="mb-4">
								<p class="form-label mb-3">I'm interested in...</p>
								<div class="d-flex flex-wrap gap-2">
									<input type="checkbox" class="btn-check" id="ux" name="interest" value="ux" />
									<label class="btn btn-pill-custom" for="ux">UX/UI & Research</label>

									<input type="checkbox" class="btn-check" id="design" name="interest" value="web-design" />
									<label class="btn btn-pill-custom" for="design">Web Design</label>

									<input type="checkbox" class="btn-check" id="graphic" name="interest" value="graphic" />
									<label class="btn btn-pill-custom" for="graphic">Graphic Design</label>

									<input type="checkbox" class="btn-check" id="other" name="interest" value="other" />
									<label class="btn btn-pill-custom" for="other">Other</label>
								</div>
							</div>

							<div class="mb-5">
								<label class="form-label">Tell me about your idea*</label>
								<textarea name="message" class="custom-input" rows="1" required></textarea>
							</div>

							<button type="submit" class="btn-submit">Submit Message</button>
						</form>
					</div>
				</div>
			</div>
		</main>

		<div class="divider-container-flipped bg-pervinca-light"></div>
